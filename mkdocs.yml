site_name: Weavly
site_description: Documentation for the Weavly dialog scripting language and its tooling.
site_url: https://weavly-lang.github.io/weavly-docs/
repo_url: https://github.com/weavly-lang/weavly-docs
edit_uri: edit/main/docs/

validation:
  links:
    anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Language Reference:
      - Overview: language/index.md
      - Text: language/text.md
      - Dialogue: language/dialogue.md
      - Statements: language/statements.md
      - Conditions and randomness: language/blocks.md
      - Options: language/options.md
      - Expressions: language/expressions.md
      - Declarations (@env): language/env.md
      - Storylets and meta: language/meta.md
      - Limitations: language/limitations.md
  - Compiler (CLI):
      - Installation and usage: compiler/index.md
      - Errors and warnings: compiler/diagnostics.md
      - Build output: compiler/output.md
  - Godot Addon:
      - Installation: godot/index.md
      - Quick start: godot/quickstart.md
      - Running dialogue: godot/engine.md
      - Variables and functions: godot/game-data.md
      - Characters: godot/characters.md
      - Storylets and pools: godot/storylets.md
      - Saving and loading: godot/saving.md
      - Custom services: godot/services.md
      - Starter UIs: godot/ui.md
      - Editor: godot/editor.md
      - API reference: godot/api.md

hooks:
  - hooks/wvl_names.py

extra_css:
  - stylesheets/wvl.css
